name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', 'stable']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./mods ./modgen ./cmd/...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Claude Code release pinned in UPSTREAM.md
        run: npm install --prefix "$RUNNER_TEMP/cc" @anthropic-ai/claude-code@2.1.312
      - name: End to end
        run: |
          export CLAUDE_BIN="$RUNNER_TEMP/cc/node_modules/.bin/claude"
          go test -count=1 -v ./e2e/
